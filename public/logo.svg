<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="Metrie GP — Scan 3D LiDAR" preserveAspectRatio="xMinYMid meet">
  <title>Metrie GP</title>

  <!-- Scan-sweep mark : three concentric quarter-arcs radiating from a focal point,
       with a few accent dots evoking a captured point-cloud sample. -->
  <g transform="translate(14, 16)" fill="none" stroke="#40ff88" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 48 24 A 24 24 0 0 0 24 0"  stroke-width="1.5" opacity="0.50"/>
    <path d="M 40 24 A 16 16 0 0 0 24 8"  stroke-width="1.5" opacity="0.72"/>
    <path d="M 32 24 A  8  8 0 0 0 24 16" stroke-width="1.5"/>
  </g>

  <g transform="translate(14, 16)" stroke="none" fill="#40ff88">
    <circle cx="24" cy="24" r="2.6"/>
    <circle cx="36" cy="10" r="1.5" opacity="0.85"/>
    <circle cx="44" cy="14" r="1.0" opacity="0.55"/>
    <circle cx="30" cy="4"  r="0.9" opacity="0.45"/>
  </g>

  <!-- Wordmark — Inter Light + italic GP in accent green. `currentColor`
       lets the wordmark adapt to dark or light backgrounds via CSS. -->
  <text x="88" y="52"
        font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="300"
        font-size="38"
        letter-spacing="-1.2"
        fill="#f0fff4">metrie</text>
  <text x="222" y="52"
        font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="500"
        font-style="italic"
        font-size="32"
        letter-spacing="-0.6"
        fill="#40ff88">GP</text>
</svg>
