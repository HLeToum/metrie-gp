<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Metrie GP">
  <title>Metrie GP</title>
  <!-- Square mark for favicon, social avatar, monogram usage. Centered scan-sweep
       with accent green focal point on a transparent background. -->
  <g transform="translate(8, 12)" fill="none" stroke="#40ff88" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 48 24 A 24 24 0 0 0 24 0"  stroke-width="2"   opacity="0.50"/>
    <path d="M 40 24 A 16 16 0 0 0 24 8"  stroke-width="2"   opacity="0.72"/>
    <path d="M 32 24 A  8  8 0 0 0 24 16" stroke-width="2"/>
  </g>
  <g transform="translate(8, 12)" stroke="none" fill="#40ff88">
    <circle cx="24" cy="24" r="3.2"/>
    <circle cx="36" cy="10" r="1.8" opacity="0.85"/>
    <circle cx="44" cy="14" r="1.3" opacity="0.55"/>
    <circle cx="30" cy="4"  r="1.1" opacity="0.45"/>
  </g>
  <!-- Tiny "GP" mono mark beneath the sweep, JetBrains Mono style -->
  <text x="32" y="58"
        font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-weight="600"
        font-size="11"
        text-anchor="middle"
        letter-spacing="2"
        fill="#40ff88">GP</text>
</svg>
