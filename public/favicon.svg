<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Metrie GP">
  <title>Metrie GP</title>
  <!-- Favicon-specific mark. Unlike logo-mark.svg it carries its own dark
       plate so it stays legible on Google's white SERP background, uses far
       heavier strokes (a 2px stroke on this canvas renders sub-pixel at 16px)
       and drops the "GP" lettering, which depended on a font the renderer
       does not have. -->
  <rect width="64" height="64" rx="13" fill="#04140d"/>

  <!-- Scan sweep: two bold arcs radiating from the focal point, bottom-left. -->
  <g fill="none" stroke="#40ff88" stroke-linecap="round">
    <path d="M 49 47 A 32 32 0 0 0 17 15" stroke-width="6"/>
    <path d="M 33 47 A 16 16 0 0 0 17 31" stroke-width="6" opacity="0.6"/>
  </g>

  <!-- Scanner position -->
  <circle cx="17" cy="47" r="6" fill="#40ff88"/>

  <!-- Captured point-cloud samples. They separate the mark from the RSS
       glyph, which is the same two-arcs-and-a-dot shape. -->
  <circle cx="44" cy="18" r="3.4" fill="#40ff88"/>
  <circle cx="53" cy="30" r="2.6" fill="#40ff88" opacity="0.75"/>
</svg>
